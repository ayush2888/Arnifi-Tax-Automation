services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: daftar-local-only
      POSTGRES_DB: daftar
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: daftar
      MINIO_ROOT_PASSWORD: daftar-local-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio:/data

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@postgres:5432/daftar
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@postgres:5432/daftar
      WORKER_DATABASE_URL: postgresql://daftar_worker:daftar-local-only@postgres:5432/daftar
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      S3_REGION: us-east-1
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      OCR_PROVIDER: local
      WORKER_TOKEN: dev-worker-token
      PDF_PROBE_MIN_CHARS: "30"
    ports:
      - "4711:4711"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@postgres:5432/daftar
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@postgres:5432/daftar
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:59000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      S3_REGION: us-east-1
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      OCR_PROVIDER: local
      WORKER_BASE_URL: http://worker:4711
      WORKER_TOKEN: dev-worker-token
      PDF_PROBE_MIN_CHARS: "30"
      PORT: "43123"
      HOSTNAME: 0.0.0.0
    ports:
      - "43123:43123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  minio:
