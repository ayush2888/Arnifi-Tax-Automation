services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: daftar-local-only
      POSTGRES_DB: daftar
    ports:
      # 5432 matches CI/Playwright/npm test defaults; 54329 kept for local habit.
      - "5432:5432"
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Local mirror of MinIO (Docker Hub minio/minio pulls can fail); CI uses moto instead.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: daftar
      MINIO_ROOT_PASSWORD: daftar-local-only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio:/data

  # Optional all-in-Docker stack. Day-to-day: leave this off and run web+worker on the host
  # (npm run infra && npm run dev / npm run worker) so code reloads without rebuilding images.
  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@postgres:5432/daftar
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@postgres:5432/daftar
      WORKER_DATABASE_URL: postgresql://daftar_worker:daftar-local-only@postgres:5432/daftar
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      S3_REGION: us-east-1
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      OCR_PROVIDER: ${OCR_PROVIDER:-textract}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_TEXTRACT_ENDPOINT: ${AWS_TEXTRACT_ENDPOINT:-}
      WORKER_TOKEN: dev-worker-token
      PDF_PROBE_MIN_CHARS: "30"
    ports:
      - "4711:4711"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@postgres:5432/daftar
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@postgres:5432/daftar
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:59000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      S3_REGION: us-east-1
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      OCR_PROVIDER: ${OCR_PROVIDER:-textract}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      WORKER_BASE_URL: http://worker:4711
      WORKER_TOKEN: dev-worker-token
      PDF_PROBE_MIN_CHARS: "30"
      PORTAL_SECURITY_STATUS: PASS
      REQUIRE_DOWNLOAD_MFA: "true"
      MFA_DEMO_CODE: "000000"
      MFA_TTL_SECONDS: "300"
      PORT: "43123"
      HOSTNAME: 0.0.0.0
    ports:
      - "43123:43123"
    depends_on:
      postgres:
        condition: service_healthy

  # Linux Playwright e2e: source bind-mount + shadowed node_modules/.next (never host win32 binaries).
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-jammy
    working_dir: /work
    environment:
      E2E_IN_CONTAINER: "1"
      PGHOST: postgres
      PGPASSWORD: daftar-local-only
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@postgres:5432/daftar_e2e
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@postgres:5432/daftar_e2e
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      PORTAL_SECURITY_STATUS: FAIL
      PORT: "43127"
      HOSTNAME: "127.0.0.1"
    volumes:
      - .:/work
      - e2e_node_modules:/work/node_modules
      - e2e_next:/work/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    entrypoint: ["node", "scripts/e2e-docker-inner.mjs"]

volumes:
  pgdata:
  minio:
  e2e_node_modules:
  e2e_next:
